<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
  <title id="title">Winner — Code, design, repeat.</title>
  <desc id="desc">A dark terminal with violet and cyan accents, twinkling stars, and a blinking cursor.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#17132d"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#a78bfa" stroke-opacity=".06"/>
    </pattern>
  </defs>
  <rect x="1" y="1" width="998" height="298" rx="20" fill="url(#bg)" stroke="#38304f"/>
  <rect x="2" y="2" width="996" height="296" rx="20" fill="url(#grid)"/>
  <path d="M1 47H999" stroke="#38304f"/>
  <g>
    <circle cx="27" cy="25" r="5" fill="#fb7185"/>
    <circle cx="47" cy="25" r="5" fill="#fbbf24"/>
    <circle cx="67" cy="25" r="5" fill="#34d399"/>
  </g>
  <text x="500" y="30" text-anchor="middle" fill="#a6a2bb" font-family="monospace" font-size="12">winner@github: ~ / my-universe</text>
  <text x="64" y="95" fill="#67e8f9" font-family="monospace" font-size="14">$ hello, world</text>
  <text x="59" y="174" fill="#ede9fe" font-family="Verdana, sans-serif" font-weight="bold" font-size="70" letter-spacing="9">WINNER</text>
  <rect x="450" y="120" width="13" height="56" rx="2" fill="#a78bfa">
    <animate attributeName="opacity" values="1;1;0;0" dur="1.4s" repeatCount="indefinite"/>
  </rect>
  <text x="64" y="215" fill="#b9afce" font-family="monospace" font-size="18">Code. Design. Repeat.</text>
  <circle cx="70" cy="260" r="4" fill="#34d399">
    <animate attributeName="opacity" values="1;.35;1" dur="3s" repeatCount="indefinite"/>
  </circle>
  <text x="84" y="265" fill="#a6a2bb" font-family="monospace" font-size="12">LEARNING MODE: ON</text>
  <g fill="none" stroke="#a78bfa" stroke-width="2">
    <circle cx="799" cy="165" r="78" opacity=".2"/>
    <ellipse cx="799" cy="165" rx="112" ry="33" transform="rotate(-30 799 165)" opacity=".5"/>
    <path d="m773 143-24 22 24 22m52-44 24 22-24 22m-18-52-16 60" stroke="#67e8f9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g fill="#c4b5fd">
    <circle cx="692" cy="93" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="914" cy="205" r="3"><animate attributeName="opacity" values="1;.2;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="87" r="2"/>
    <circle cx="676" cy="237" r="2"/>
  </g>
</svg>
